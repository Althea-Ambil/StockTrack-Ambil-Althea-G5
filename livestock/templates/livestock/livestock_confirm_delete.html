
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Livestock | StockTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f2;
            font-family: Arial, sans-serif;
        }

        .delete-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="delete-card text-center">

                <h2 class="text-danger mb-3">
                    Delete Livestock Record?
                </h2>

                <p class="text-muted">
                    Are you sure you want to delete this livestock record?
                </p>

                <div class="bg-light rounded p-3 mb-4">

                    <h5>{{ livestock.name }}</h5>

                    <p class="mb-1">
                        Tag Number: {{ livestock.tag_number }}
                    </p>

                    <p class="mb-0">
                        Breed: {{ livestock.breed }}
                    </p>

                </div>

                <p class="text-danger small">
                    This action cannot be undone.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <div class="d-flex justify-content-center gap-2">

                        <a href="{% url 'livestock_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-danger">
                            Confirm Delete
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
