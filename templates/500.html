
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | StockTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f2;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            text-align: center;
        }

        .error-code {
            color: #dc3545;
            font-size: 80px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">500</div>

        <h2>Something Went Wrong</h2>

        <p class="text-muted">
            We're sorry! An unexpected server error occurred.
            Please try again later.
        </p>

        <a href="/" class="btn btn-success mt-3">
            Back to Home
        </a>
    </div>

</body>
</html>
